[package]
name = "dhan-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.4"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time"] }
keyring = { version = "3.6.3", features = ["windows-native"] }
