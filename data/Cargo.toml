[package]
name = "algomln-data"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
algomln = { path = ".." }
dhan-api = { path = "../dhan-api" }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "=0.10.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "brotli", "flate2-zlib-rs", "lz4", "zstd"] }
arrow-array = "60"
arrow-schema = "60"
sha2 = "0.10"
csv = "1.4"
criterion = "0.5"

[[bench]]
name = "catalog_source"
harness = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }
