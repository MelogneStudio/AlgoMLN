[package]
name = "dhan-token"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Lightweight standalone parser and claim inspector for Dhan access tokens"
license = "MIT"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[[example]]
name = "token-info"
path = "examples/token_info.rs"
