[package]
name = "algomln"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Standalone AlgoMLN strategy language frontend"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4"
parquet = { version = "=53.4.1", default-features = false, features = ["arrow", "snap", "brotli", "flate2", "lz4", "zstd"] }
arrow-array = "=53.4.1"
arrow-schema = "=53.4.1"
chrono-tz = "=0.10.4"
rayon = "=1.10.0"

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[[bench]]
name = "indicators"
harness = false

[[bench]]
name = "sim_pipeline"
harness = false

[lib]
path = "src/lib.rs"

[workspace]
members = ["dhan-api", "data", "cli"]
exclude = ["fuzz"]
